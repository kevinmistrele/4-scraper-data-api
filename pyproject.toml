[project]
name = "scraper-data-api"
version = "1.0.0"
description = "Pipeline de coleta, normalizacao, armazenamento, API e dashboard para indicadores publicos."
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "requests>=2.32.0",
    "streamlit>=1.36.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.setuptools]
packages = ["api", "collector", "dashboard"]
py-modules = ["scheduler", "storage"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
